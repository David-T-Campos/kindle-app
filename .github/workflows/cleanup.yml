name: Delete expired book artifacts

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: none

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete expired private artifacts
        env:
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --max-time 60 \
            --request POST \
            --header "x-worker-secret: ${WORKER_SHARED_SECRET}" \
            https://os-meus-livros.vercel.app/api/internal/cleanup
