name: Build conversion worker image

on:
  push:
    branches: [main]
    paths:
      - "worker-runtime/**"
      - ".github/workflows/build-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: os-meus-livros-worker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to the private image registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and verify the pinned worker
        env:
          WORKER_IMAGE: ghcr.io/david-t-campos/kindle-app-worker:calibre-9.12.0-v2
        run: |
          docker build --pull --build-arg CALIBRE_VERSION=9.12.0 --tag "$WORKER_IMAGE" worker-runtime
          docker run --rm --entrypoint /bin/sh "$WORKER_IMAGE" -c '
            set -eu
            test -e /usr/share/zoneinfo/UTC
            python3 -c "from zoneinfo import ZoneInfo; ZoneInfo(\"UTC\")"
            ebook-convert --version
            java -jar /opt/epubcheck/epubcheck.jar --version
            printf "%s\n" "<!doctype html><html><head><meta charset=\"utf-8\"><title>Worker test</title></head><body><h1>Worker test</h1><p>This harmless fixture proves the complete conversion engine starts and produces a valid EPUB.</p></body></html>" > /tmp/input.html
            ebook-convert /tmp/input.html /tmp/output.epub --output-profile kindle_pw3
            test -s /tmp/output.epub
            java -jar /opt/epubcheck/epubcheck.jar /tmp/output.epub
          '
      - name: Exercise real EPUB validator regressions
        env:
          WORKER_IMAGE: ghcr.io/david-t-campos/kindle-app-worker:calibre-9.12.0-v2
        run: |
          docker run --rm \
            --entrypoint python3 \
            --volume "$PWD/worker-runtime/test_validator.py:/tmp/test_validator.py:ro" \
            "$WORKER_IMAGE" /tmp/test_validator.py
      - name: Verify the two exact failed Drive books without delivery
        if: hashFiles('.github/real-book-gate') != ''
        env:
          APP_ORIGIN: https://os-meus-livros.vercel.app
          WORKER_IMAGE: ghcr.io/david-t-campos/kindle-app-worker:calibre-9.12.0-v2
        run: |
          set -euo pipefail
          cleanup() {
            for path in /tmp/real-book-1.epub /tmp/real-book-2.epub; do
              if test -f "$path"; then
                shred -u "$path" 2>/dev/null || rm -f "$path"
              fi
            done
          }
          trap cleanup EXIT
          slot=0
          for job_id in \
            72a80f8b-51c9-428d-b689-55ddfa024e03 \
            54455418-5cc1-4317-869e-994a26ffe9ba
          do
            slot=$((slot + 1))
            audience=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote("os-meus-livros:"+sys.argv[1], safe=""))' "$job_id")
            oidc_token=$(curl --fail-with-body --silent --show-error --max-time 30 \
              --header "authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
            echo "::add-mask::$oidc_token"
            curl --fail-with-body --silent --show-error --max-time 300 \
              --header "x-github-oidc-token: $oidc_token" \
              "$APP_ORIGIN/api/internal/jobs/$job_id/source" \
              --output "/tmp/real-book-$slot.epub"
            test -s "/tmp/real-book-$slot.epub"
          done
          docker run --rm \
            --entrypoint python3 \
            --volume "$PWD/worker-runtime/test_real_books.py:/tmp/test_real_books.py:ro" \
            --volume "/tmp/real-book-1.epub:/private/book-1.epub:ro" \
            --volume "/tmp/real-book-2.epub:/private/book-2.epub:ro" \
            "$WORKER_IMAGE" /tmp/test_real_books.py /private/book-1.epub /private/book-2.epub
      - name: Prove the published worker can authenticate to production
        env:
          APP_ORIGIN: https://os-meus-livros.vercel.app
          WORKER_IMAGE: ghcr.io/david-t-campos/kindle-app-worker:calibre-9.12.0-v2
        run: |
          docker run --rm \
            --entrypoint python3 \
            --env ACTIONS_ID_TOKEN_REQUEST_URL \
            --env ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            --env APP_ORIGIN \
            "$WORKER_IMAGE" -c 'import sys; sys.path.insert(0,"/app"); from server import APP_ORIGIN,headers_for; from urllib.request import Request,urlopen; request=Request(APP_ORIGIN+"/api/internal/worker-auth-smoke",headers=headers_for({"jobId":"smoke"}),method="POST"); response=urlopen(request,timeout=30); assert response.status == 200'
      - name: Publish the verified worker
        env:
          WORKER_IMAGE: ghcr.io/david-t-campos/kindle-app-worker:calibre-9.12.0-v2
        run: docker push "$WORKER_IMAGE"
