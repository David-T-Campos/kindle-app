name: Convert one selected book

on:
  workflow_dispatch:
    inputs:
      job_id: { required: true, type: string }
      issued_at: { required: true, type: string }
      # Kept optional during the zero-downtime backend rollout. It is ignored;
      # the worker derives a fresh token from the encrypted Actions secret.
      token: { required: false, type: string }
      origin: { required: true, type: string }
      region: { required: true, type: string }
      calibre_version: { required: true, type: string }
      profile_version: { required: true, type: string }
      validator_version: { required: true, type: string }

permissions:
  contents: read
  packages: read

concurrency:
  group: os-meus-livros-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the pinned worker contract
        env:
          INPUT_CALIBRE_VERSION: ${{ inputs.calibre_version }}
          INPUT_PROFILE_VERSION: ${{ inputs.profile_version }}
          INPUT_VALIDATOR_VERSION: ${{ inputs.validator_version }}
        run: |
          test "$INPUT_CALIBRE_VERSION" = "9.12.0"
          test "$INPUT_PROFILE_VERSION" = "default-1"
          test "$INPUT_VALIDATOR_VERSION" = "1"
      - name: Prepare private job authentication
        env:
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          INPUT_JOB_ID: ${{ inputs.job_id }}
          INPUT_ISSUED_AT: ${{ inputs.issued_at }}
        run: |
          JOB_TOKEN=$(python3 -c 'import base64,hashlib,hmac,os; message=os.environ["INPUT_JOB_ID"]+"."+os.environ["INPUT_ISSUED_AT"]; print(base64.urlsafe_b64encode(hmac.new(os.environ["WORKER_SHARED_SECRET"].encode(), message.encode(), hashlib.sha256).digest()).rstrip(b"=").decode())')
          echo "::add-mask::$JOB_TOKEN"
          echo "JOB_TOKEN=$JOB_TOKEN" >> "$GITHUB_ENV"
      - name: Load the prebuilt conversion worker
        env:
          GHCR_TOKEN: ${{ github.token }}
          WORKER_IMAGE: ghcr.io/david-t-campos/kindle-app-worker:calibre-9.12.0-v2
          INPUT_CALIBRE_VERSION: ${{ inputs.calibre_version }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          if ! docker pull "$WORKER_IMAGE"; then
            docker build --pull --build-arg CALIBRE_VERSION="$INPUT_CALIBRE_VERSION" --tag "$WORKER_IMAGE" worker-runtime
          fi
      - name: Convert, validate, and submit one book
        env:
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          APP_ORIGIN: https://os-meus-livros.vercel.app
          INPUT_ORIGIN: ${{ inputs.origin }}
          INPUT_JOB_ID: ${{ inputs.job_id }}
          INPUT_ISSUED_AT: ${{ inputs.issued_at }}
          INPUT_REGION: ${{ inputs.region }}
          CALIBRE_VERSION: ${{ inputs.calibre_version }}
          EPUBCHECK_VERSION: "5.3.0"
          PROFILE_VERSION: ${{ inputs.profile_version }}
          VALIDATOR_VERSION: ${{ inputs.validator_version }}
          WORKER_IMAGE: ghcr.io/david-t-campos/kindle-app-worker:calibre-9.12.0-v2
        run: |
          test "$INPUT_ORIGIN" = "$APP_ORIGIN"
          export JOB_PAYLOAD
          JOB_PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"job_id":os.environ["INPUT_JOB_ID"],"issued_at":os.environ["INPUT_ISSUED_AT"],"token":os.environ["JOB_TOKEN"],"origin":os.environ["INPUT_ORIGIN"],"region":os.environ["INPUT_REGION"],"calibre_version":os.environ["CALIBRE_VERSION"],"profile_version":os.environ["PROFILE_VERSION"],"validator_version":os.environ["VALIDATOR_VERSION"]},separators=(",",":")))')
          docker run --rm \
            --entrypoint python3 \
            --env WORKER_SHARED_SECRET \
            --env APP_ORIGIN \
            --env CALIBRE_VERSION \
            --env EPUBCHECK_VERSION \
            --env PROFILE_VERSION \
            --env VALIDATOR_VERSION \
            --env JOB_PAYLOAD \
            "$WORKER_IMAGE" /app/run_job.py
      - name: Report an infrastructure failure to the app
        if: failure()
        env:
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          APP_ORIGIN: https://os-meus-livros.vercel.app
          INPUT_JOB_ID: ${{ inputs.job_id }}
          INPUT_ISSUED_AT: ${{ inputs.issued_at }}
        run: |
          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 \
            --request PATCH \
            --header "content-type: application/json" \
            --header "x-worker-secret: $WORKER_SHARED_SECRET" \
            --header "x-job-issued-at: $INPUT_ISSUED_AT" \
            --header "x-job-token: $JOB_TOKEN" \
            --data '{"stage":"DOWNLOAD","detail":"O serviço de conversão não conseguiu iniciar","state":"FAILED","errorCode":"WORKER_IMAGE_UNAVAILABLE"}' \
            "$APP_ORIGIN/api/internal/jobs/$INPUT_JOB_ID/status")
          test "$STATUS" = 200 -o "$STATUS" = 409
