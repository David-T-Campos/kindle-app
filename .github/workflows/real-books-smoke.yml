name: Verify five real Drive books without delivery
# Re-run after monotonic second-pass repair progress.

on:
  push:
    branches: [main]
    paths: [".github/workflows/real-books-smoke.yml"]

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: os-meus-livros-real-books-smoke
  cancel-in-progress: false

env:
  APP_ORIGIN: https://os-meus-livros.vercel.app
  WORKER_IMAGE: ghcr.io/david-t-campos/kindle-app-worker:calibre-9.12.0-v2

jobs:
  provision:
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.create.outputs.jobs }}
    steps:
      - id: create
        name: Create five isolated no-delivery jobs
        run: |
          AUDIENCE=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("os-meus-livros:real-books-smoke", safe=""))')
          TOKEN=$(curl --fail-with-body --silent --show-error --max-time 30 \
            --header "authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$TOKEN"
          RESPONSE=$(curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST \
            --header "content-type: application/json" \
            --header "x-github-oidc-token: $TOKEN" \
            --data '{"action":"create"}' \
            "$APP_ORIGIN/api/internal/real-books-smoke")
          JOBS=$(python3 -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1])["jobs"],separators=(",",":")))' "$RESPONSE")
          test "$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$JOBS")" = 5
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"

  convert:
    needs: provision
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        job: ${{ fromJSON(needs.provision.outputs.jobs) }}
    steps:
      - name: Load the verified worker image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$WORKER_IMAGE"
      - name: Run the exact production worker without Gmail or Kindle submission
        env:
          JOB_PAYLOAD: ${{ toJSON(matrix.job) }}
          CALIBRE_VERSION: "9.12.0"
          EPUBCHECK_VERSION: "5.3.0"
          PROFILE_VERSION: "default-1"
          VALIDATOR_VERSION: "1"
        run: |
          docker run --rm \
            --entrypoint python3 \
            --env ACTIONS_ID_TOKEN_REQUEST_URL \
            --env ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            --env APP_ORIGIN \
            --env CALIBRE_VERSION \
            --env EPUBCHECK_VERSION \
            --env PROFILE_VERSION \
            --env VALIDATOR_VERSION \
            --env JOB_PAYLOAD \
            "$WORKER_IMAGE" /app/run_job.py

  verify-and-clean:
    if: always()
    needs: [provision, convert]
    runs-on: ubuntu-24.04
    steps:
      - name: Obtain a fresh production identity
        run: |
          AUDIENCE=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("os-meus-livros:real-books-smoke", safe=""))')
          TOKEN=$(curl --fail-with-body --silent --show-error --max-time 30 \
            --header "authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$TOKEN"
          echo "SMOKE_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Prove all five real books reached artifact storage without delivery
        env:
          JOBS: ${{ needs.provision.outputs.jobs }}
        run: |
          BODY=$(python3 -c 'import json,os; jobs=json.loads(os.environ["JOBS"]); print(json.dumps({"action":"results","jobIds":[job["job_id"] for job in jobs]},separators=(",",":")))')
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST \
            --header "content-type: application/json" \
            --header "x-github-oidc-token: $SMOKE_OIDC_TOKEN" \
            --data "$BODY" \
            "$APP_ORIGIN/api/internal/real-books-smoke" > /tmp/results.json
          python3 - <<'PY'
          import json
          result = json.load(open("/tmp/results.json"))
          jobs = result.get("jobs", [])
          assert len(jobs) == 5, jobs
          for job in jobs:
              assert job["state"] == "SUBMITTED" and job["stage"] == "SUBMITTED", job
              assert not job["errorCode"] and int(job["outputSize"] or 0) > 0, job
              validation = json.loads(job["validationJson"])
              assert validation["schemaVersion"] == 1
              assert validation["output"]["readableSpineItems"] > 0
              assert validation["epubcheck"]["version"] == "5.3.0"
              assert int(job["deliveryCount"]) == 0, job
          print("5/5 real Drive books passed download, validation or repair, artifact upload, and no-delivery completion")
          PY
      - name: Remove every temporary test job and uncached artifact
        if: always()
        env:
          JOBS: ${{ needs.provision.outputs.jobs }}
        run: |
          BODY=$(python3 -c 'import json,os; jobs=json.loads(os.environ["JOBS"]); print(json.dumps({"action":"cleanup","jobIds":[job["job_id"] for job in jobs]},separators=(",",":")))')
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST \
            --header "content-type: application/json" \
            --header "x-github-oidc-token: $SMOKE_OIDC_TOKEN" \
            --data "$BODY" \
            "$APP_ORIGIN/api/internal/real-books-smoke"
